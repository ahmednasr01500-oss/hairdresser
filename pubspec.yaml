name: akhdar
description: "أخضر — مِتنَقّي بالوَاحدَه | تطبيق طلب الخضار والفاكهة الطازجة"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  firebase_core: ^4.1.1
  firebase_database: ^12.0.2
  firebase_auth: ^6.1.0

  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  intl: ^0.20.2

  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  http: ^1.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# أيقونة التطبيق على شاشة الموبايل. بتتولّد من اللوجو بأمر واحد:
#   dart run flutter_launcher_icons
# لازم تتشغّل تاني لو اللوجو اتغيّر.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon.png"

  # أندرويد الحديث بيقص الأيقونة بأشكال مختلفة حسب الجهاز (دايرة، مربع
  # بحواف…)، فبيحتاج طبقة أمامية اللوجو فيها في النص وخلفية لونها ثابت.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"

  # iOS مبيقبلش شفافية في الأيقونة.
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
